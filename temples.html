<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Temple Album</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root{--bg:#F3F4EF;--paper:#FFF;--ink:#1F2A24;--ink-soft:#4A564E;--accent:#2E5A46;--accent-dark:#1F3D30;--header-bg:#1F3D30;--gold:#B98A19;--border:#DADFD5;--font-display:"Fraunces",Georgia,serif;--font-body:"Inter",system-ui,sans-serif;--max-width:1000px}
		*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}img{max-width:100%;display:block}a{color:var(--accent)}:focus-visible{outline:2px solid var(--accent-dark);outline-offset:3px}
		header{background:var(--header-bg)}.header-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem}.site-title{color:var(--bg);font-family:var(--font-display);font-weight:600;font-size:clamp(1.15rem,1rem + 1vw,1.5rem)}.hamburger{background:transparent;border:2px solid var(--bg);color:var(--bg);font-size:1.15rem;line-height:1;padding:.4rem .65rem;border-radius:4px;cursor:pointer}.hamburger:hover,.hamburger:focus-visible{background:rgba(255,255,255,.12)}nav ul{list-style:none;margin:0;padding:0 1.25rem 1.1rem;display:none;flex-direction:column;gap:.85rem;background:var(--header-bg)}nav ul.nav-open{display:flex}nav a{position:relative;display:inline-block;color:var(--bg);text-decoration:none;font-weight:500;padding:.25rem .05rem}nav a::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}nav a:hover::after,nav a:focus-visible::after{transform:scaleX(1)}
		main{max-width:var(--max-width);margin:0 auto;padding:2.25rem 1.25rem 3rem}main h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.6rem,1.3rem + 1.5vw,2.25rem);text-align:center;margin:0 0 1.75rem}.gallery{display:grid;grid-template-columns:1fr;gap:1.5rem}figure{margin:0;background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-align:center}figure img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}figcaption{padding:.75rem .5rem;font-weight:500;color:var(--ink-soft)}footer{border-top:1px solid var(--border);padding:1.5rem;text-align:center;font-size:.875rem;color:var(--ink-soft)}footer p{margin:.25rem 0}
		@media (min-width:650px){.hamburger{display:none}nav ul{display:flex;flex-direction:row;justify-content:flex-end;gap:1.5rem;padding:0 1.25rem 1rem}.gallery{grid-template-columns:repeat(2,1fr)}}
		@media (min-width:900px){.gallery{grid-template-columns:repeat(3,1fr)}}@media (prefers-reduced-motion:reduce){nav a::after{transition:none}}
	</style>
</head>
<body>
	<header>
		<div class="header-bar"><div class="site-title">Temple Album</div><button class="hamburger" aria-label="Open menu" aria-expanded="false">☰</button></div>
		<nav aria-label="Main navigation"><ul><li><a href="temples.html">Home</a></li><li><a href="#favorites">Favorites</a></li><li><a href="#about">About</a></li></ul></nav>
	</header>
	<main>
		<h1>Temples</h1>
		<section class="gallery" id="favorites" aria-label="Temple gallery">
			<figure><img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80" alt="Temple surrounded by trees" loading="lazy"><figcaption>Temple of the Sacred Grove</figcaption></figure>
			<figure><img src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=800&q=80" alt="White temple against a blue sky" loading="lazy"><figcaption>Temple in the Mountains</figcaption></figure>
			<figure><img src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=800&q=80" alt="Historic temple architecture" loading="lazy"><figcaption>Historic City Temple</figcaption></figure>
		</section>
	</main>
	<footer id="about"><p>Temple Album</p><p>&copy; 2025</p></footer>
	<script>const button=document.querySelector('.hamburger'),menu=document.querySelector('nav ul');button.addEventListener('click',()=>{const open=menu.classList.toggle('nav-open');button.setAttribute('aria-expanded',open);button.setAttribute('aria-label',open?'Close menu':'Open menu')});</script>
</body>
</html>
