      <figure>

      </figure>

      <figure>
        <img src="images/johannesburg-temple.jpg" alt="The Johannesburg South Africa Temple at dusk with its tower lit up" width="640" height="422" loading="lazy">
        <figcaption>Johannesburg South Africa Temple</figcaption>
      </figure>

      <figure>
        <img src="images/durban-temple.jpg" alt="The Durban South Africa Temple with its golden angel Moroni statue against a bright sky" width="640" height="480" loading="lazy">

      </figure>

      <figure>
        <img src="images/accra-ghana-temple.jpg" alt="The Accra Ghana Temple with palm trees and a gated entrance" width="640" height="320" loading="lazy">

      </figure>

      <figure>
        <img src="images/harare-temple.jpg" alt="The Harare Zimbabwe Temple lit up at dusk with an orange sunset sky and lamp posts lining the path" width="640" height="360" loading="lazy">
        <figcaption>Harare Zimbabwe Temple</figcaption>
      </figure>
